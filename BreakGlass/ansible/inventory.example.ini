# Przykładowy inwentarz pilotowy; bg_product jest nazwą PRODUKTU, nie typu systemu.
# Każdy host powinien wystąpić dokładnie raz. Hasła trzymane tylko w zaszyfrowanym Vault.
[bg_windows]
win-erp01.example.invalid bg_product=ERP
win-crm01.example.invalid bg_product=CRM

[bg_rhel]
rhel-erp01.example.invalid bg_product=ERP
rhel-crm01.example.invalid bg_product=CRM

[bg_windows:vars]
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=kerberos
ansible_winrm_server_cert_validation=validate

[bg_rhel:vars]
ansible_connection=ssh
ansible_become=true
